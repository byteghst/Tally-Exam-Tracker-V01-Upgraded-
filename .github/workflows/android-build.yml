name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
        # No `cache: npm` here on purpose: actions/setup-node hashes an
        # existing lockfile to build its cache key, so on a fresh repo with
        # no package-lock.json yet, enabling the cache makes this step fail
        # outright before the "Install dependencies" step below ever runs
        # (the one that actually generates the lockfile). Once a lockfile
        # exists and stays committed, caching can be re-added safely if
        # faster builds are worth the added complexity.

      - name: Install dependencies
        # npm install (not npm ci) so a package.json edited directly on
        # GitHub's web UI doesn't hard-fail the whole build over a
        # momentarily out-of-sync lock file — see the step below, which
        # commits the corrected lock file back automatically.
        run: npm install

      - name: Commit updated lock file if it changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync package-lock.json [skip ci]"
            git push
          fi

      - name: Build web app
        # APP_BUILD is baked into the app (see vite.config.ts) and is what the
        # in-app update check compares against the newest `build-N` release.
        env:
          APP_BUILD: ${{ github.run_number }}
        run: npm run build

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Use stable debug keystore
        # Without this, every CI run gets its own fresh, randomly-generated
        # debug.keystore (each runner is a brand-new machine), so every
        # build is signed with a different key. Android refuses to install
        # an update over an already-installed app unless the signing
        # certificate matches exactly — that's the "conflicts with an
        # existing package" install error. Using the same committed
        # keystore on every run keeps every build's signature identical, so
        # updates install cleanly from here on. It's stored as base64 text
        # (ci/debug.keystore.b64) rather than a raw binary file so it can be
        # created by pasting into GitHub's web "Create new file" editor.
        run: |
          mkdir -p ~/.android
          base64 -d ci/debug.keystore.b64 > ~/.android/debug.keystore

      - name: Add or sync Capacitor Android platform
        # `cap sync` only updates an android/ project that already exists —
        # it can't create one. Since android/ isn't committed to this repo
        # (it's a generated native project, regenerated fresh every run),
        # a plain `cap sync android` fails on every clean checkout with
        # "android platform has not been added yet." `cap add` both creates
        # the platform AND performs an initial sync, so it's the right call
        # the first time; plain `cap sync` is only needed if android/ was
        # somehow already present (e.g. a self-hosted runner reusing state).
        # This has to run before icon/splash generation below — that step
        # writes into android/app/src/main/res, which doesn't exist until
        # this step creates it.
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Generate branded icons and splash screen
        run: npx --yes @capacitor/assets generate --android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Force stable signing
        run: bash ci/force-signing.sh

      - name: Stamp Android version
        # Android only lets an APK install over an existing one if its
        # versionCode is not lower, and the generated project always starts at
        # 1. Tying it to the run number makes every build strictly newer than
        # the last, and keeps it identical to the app's __APP_BUILD__ and the
        # `build-N` release tag.
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"0.1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tally-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Prepare release files
        # The commit message goes through an env var (never straight into the
        # script) so odd characters in it can't break or inject into the shell.
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk tally.apk
          if [ -n "$COMMIT_MSG" ]; then
            printf '%s\n' "$COMMIT_MSG" > release-notes.txt
          else
            echo "Manual build" > release-notes.txt
          fi

      - name: Publish GitHub release
        # This is what the in-app update check reads. Because the repo is
        # public, the release and its APK are downloadable by anyone, and
        # releases/latest/download/tally.apk is a permanent link to the newest.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tally build ${{ github.run_number }}
          body_path: release-notes.txt
          target_commitish: ${{ github.sha }}
          files: tally.apk
          make_latest: 'true'
