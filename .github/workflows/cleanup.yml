name: Clean up releases and runs

on:
  workflow_dispatch:
  schedule:
    # Daily at 00:00 UTC (06:00 Bangladesh time)
    - cron: "0 0 * * *"

permissions:
  contents: write
  actions: write

jobs:
  releases:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all releases except the newest build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # Find the highest numeric build-N release. If none exist, delete no releases.
          latest=$(gh release list --limit 1000 --json tagName --jq '[.[].tagName | select(startswith("build-")) | ltrimstr("build-") | select(test("^[0-9]+$")) | tonumber] | if length == 0 then "" else max end')

          if [[ -z "$latest" ]]; then
            echo "No build-N releases found; skipping release cleanup."
            exit 0
          fi

          keep="build-$latest"
          echo "Keeping newest build release: $keep"

          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
          while IFS= read -r tag; do
            [[ -z "$tag" || "$tag" == "$keep" ]] && continue
            echo "Deleting release and associated tag: $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done

  runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete previous completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # Deletes completed runs only; the current cleanup run is still in progress.
          gh run list --limit 1000 --json databaseId,status --jq '.[] | select(.status == "completed") | .databaseId' |
          while IFS= read -r id; do
            [[ -z "$id" ]] && continue
            echo "Deleting completed workflow run: $id"
            gh run delete "$id"
          done
