<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Tally brand mark: three paper bars struck through by one persimmon stroke,
       on a warm ink tile. Reference copy of the drawing in
       scripts/build-icons.mjs, which generates every app icon and the launch
       screen from this same geometry. -->
  <rect width="512" height="512" rx="112" fill="#1C1814"/>

  <g transform="translate(52.2 62.3) scale(1.27)">
    <rect x="69" y="50" width="38" height="205" fill="#F6F1E8"/>
    <rect x="135" y="50" width="38" height="205" fill="#F6F1E8"/>
    <rect x="201" y="50" width="38" height="205" fill="#F6F1E8"/>
    <line x1="27" y1="202" x2="294" y2="83" stroke="#D94F2D" stroke-width="34" stroke-linecap="square"/>
  </g>
</svg>
